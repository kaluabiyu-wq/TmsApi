name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TmsApi.slnx

      - name: Build
        run: dotnet build TmsApi.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test TmsApi.slnx --no-build --configuration Release --verbosity normal